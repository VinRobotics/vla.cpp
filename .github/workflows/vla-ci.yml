# Cross-platform VLA regression CI.
# Fires on a push to `dev`, or by hand. Runs on the self-hosted runner labelled
# `vla-ci-orchestrator` (register your orchestrator host with that label - the
# actual hostname stays out of the repo, in the hosts.env that the runner's
# VLA_CI_HOSTS_ENV points at). Keep that runner in a runner group restricted to
# VinRobotics/vla.cpp/.github/workflows/vla-ci.yml@refs/heads/dev.
# Every platform is a remote server reached over the LAN via vla-ci-agent (no
# SSH); the orchestrator drives one LIBERO client per platform. The three
# platforms are swept CONCURRENTLY in a single job (a self-hosted runner runs one
# job at a time, so the parallelism lives inside the job via `orchestrate.sh all`).
name: vla-ci

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: vla-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: [self-hosted, vla-ci-orchestrator]
    timeout-minutes: 240
    env:
      VLA_CI_EXPECTED_COMMIT: ${{ github.sha }}
      CI_OUTPUT_ROOT: ${{ github.workspace }}/outputs/ci
    steps:
      - uses: actions/checkout@v7
      - name: Host config + control tools
        run: |
          cp "${VLA_CI_HOSTS_ENV:?set VLA_CI_HOSTS_ENV in the runner .env}" ci/config/hosts.env
          cmake -S ci/agent -B ci/agent/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ci/agent/build -j
      - name: Move servers to the pushed commit, build, sweep all platforms (parallel) + gate
        run: bash ci/orchestrate.sh all
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-results
          path: outputs/ci/
