[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "vla-cpp"
version = "0.3.0"
description = "Python bindings for vla.cpp, a C++ inference engine for Vision-Language-Action models."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
# Only for the array return type; the bindings work on plain lists without it.
numpy = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/VinRobotics/vla.cpp"

[tool.scikit-build]
cmake.source-dir = "../.."
build.targets = ["vla"]
install.components = ["libvla"]
wheel.install-dir = "vla_cpp"
wheel.py-api = "py3"

[tool.scikit-build.cmake.define]
VLA_BUILD_SERVER = "OFF"
VLA_SPM = "OFF"
BUILD_SHARED_LIBS = "OFF"
GGML_NATIVE = "OFF"
GGML_OPENMP = "OFF"
CMAKE_INSTALL_LIBDIR = "lib"
CMAKE_INSTALL_BINDIR = "lib"
