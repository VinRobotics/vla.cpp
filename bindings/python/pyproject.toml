[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-cpp"
version = "0.2.0"
description = "Python bindings for vla.cpp, a C++ inference engine for Vision-Language-Action models."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
# Only for the array return type; the bindings work on plain lists without it.
numpy = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/VinRobotics/vla.cpp"

[tool.setuptools]
packages = ["vla_cpp"]

# libvla is built by cmake, not by setuptools. A wheel bundles it next to the
# package; a source checkout finds it through VLA_LIBRARY or the loader path.
[tool.setuptools.package-data]
vla_cpp = ["*.so", "*.dylib", "*.dll", "lib/*"]
